[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taichi-mpm"
version = "0.2.0"
description = "Two-Phase Material Point Method for Debris Flow Simulation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Xingqiang Chen", email = "chen.xingqiang@turingai.cc"}
]
maintainers = [
    {name = "Xingqiang Chen", email = "chen.xingqiang@turingai.cc"}
]
keywords = [
    "mpm",
    "material-point-method",
    "debris-flow",
    "simulation",
    "taichi",
    "two-phase-flow",
    "computational-mechanics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.8"
dependencies = [
    "taichi>=1.0.2",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/chenxingqiang/Taichi-PMP-3D"
Documentation = "https://github.com/chenxingqiang/Taichi-PMP-3D#readme"
Repository = "https://github.com/chenxingqiang/Taichi-PMP-3D.git"
Issues = "https://github.com/chenxingqiang/Taichi-PMP-3D/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["taichi_mpm*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"



